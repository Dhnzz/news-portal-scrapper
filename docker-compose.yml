x-postgres: &postgres
  image: postgres:16-alpine
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-news} -d ${POSTGRES_DB:-news}"]
    interval: 5s
    timeout: 5s
    retries: 10

services:
  db:
    <<: *postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-news}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-news}
      POSTGRES_DB: ${POSTGRES_DB:-news}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    profiles: ["dev"]

  migrate:
    build: .
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli seed-admin"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-news}:${POSTGRES_PASSWORD:-news}@db:5432/${POSTGRES_DB:-news}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    depends_on:
      db:
        condition: service_healthy
    profiles: ["dev"]

  app:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-news}:${POSTGRES_PASSWORD:-news}@db:5432/${POSTGRES_DB:-news}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY di .env (lihat .env.example)}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["dev"]

  test-db:
    <<: *postgres
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-news}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-news}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-news_test}
    ports:
      - "5433:5432"
    volumes:
      - testpgdata:/var/lib/postgresql/data
    profiles: ["test"]

volumes:
  pgdata:
  testpgdata: